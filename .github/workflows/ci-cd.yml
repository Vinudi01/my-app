name: CI - Build & Push Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # =====================
      # CHECKOUT
      # =====================

      - name: Checkout
        uses: actions/checkout@v4

      # =====================
      # FRONTEND CI
      # =====================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # =====================
      # BACKEND CI
      # =====================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # =====================
      # DOCKER LOGIN
      # =====================

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # =====================
      # FRONTEND DOCKER
      # =====================

      - name: Build frontend image
        run: |
          docker build \
            -t vinudi/my-app:${{ github.sha }} \
            -t vinudi/my-app:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push vinudi/my-app:${{ github.sha }}
          docker push vinudi/my-app:latest

      # =====================
      # BACKEND DOCKER
      # =====================

      - name: Build backend image
        run: |
          docker build \
            -t vinudi/my-app-backend:${{ github.sha }} \
            -t vinudi/my-app-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push vinudi/my-app-backend:${{ github.sha }}
          docker push vinudi/my-app-backend:latest
